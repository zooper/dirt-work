name: Godot headless checks

on:
  push:
  pull_request:

jobs:
  import-and-start:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import, boot and test (fails on any script error)
        run: tests/check.sh
